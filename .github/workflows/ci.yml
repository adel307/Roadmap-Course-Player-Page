name: CI & Production Verification

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  verification:
    name: Verify & Build
    if: github.event_name != 'pull_request' || github.head_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Verification (Tests, TypeCheck, Lint)
        run: npm run verify

      - name: Run Production Build
        run: npm run build